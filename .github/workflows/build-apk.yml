name: Build Jay Chat APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle') }}

      - name: Build Android APK
        run: |
          cd app
          npm install
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/android/app/build/outputs/apk/release/app-release.apk dist/JayChat-v1.2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JayChat-APK
          path: dist/JayChat-v1.2.0.apk

      - name: Publish GitHub Release (APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jaychat-latest
          name: Jay Chat APK (latest)
          body: |
            自动构建的 Jay Chat 安装包（微信风格 IM，含腾讯云 IM 实时消息 / 官方群 / Jay AI / 动态 / 通知）。
          files: dist/JayChat-v1.2.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
